name: "Closed-Unmerged PR Branch Cleanup"

on:
  # This same-repository close handler is the only unattended deletion path.
  pull_request:
    types: [closed]
  # The scheduled sweep is audit-only and never performs bulk deletion.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Optional owner/name target for a single closed PR"
        required: false
        type: string
      pr_number:
        description: "Optional closed PR number (requires repository)"
        required: false
        type: string
      enforce:
        description: "Delete only the explicit target after all safety checks"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      repository:
        description: "owner/name target repository"
        required: true
        type: string
      pr_number:
        description: "Closed PR number"
        required: true
        type: number
      enforce:
        description: "Allow deletion after all safety checks"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: "Clean a closed-unmerged PR branch safely"
    runs-on: [self-hosted, choco]
    # Do not run branch-deletion code from a fork-controlled PR workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Run targeted cleanup or organization audit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_ENFORCE: ${{ inputs.enforce }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/org-branch-hygiene.py \
              --repo "$EVENT_REPOSITORY" --pr-number "$EVENT_PR_NUMBER" --enforce \
              --output /tmp/hygiene-report.json
          elif [ -n "$INPUT_REPOSITORY" ] || [ -n "$INPUT_PR_NUMBER" ]; then
            args=(--repo "$INPUT_REPOSITORY" --pr-number "$INPUT_PR_NUMBER")
            if [ "$INPUT_ENFORCE" = "true" ]; then
              args+=(--enforce)
            fi
            python3 scripts/org-branch-hygiene.py "${args[@]}" --output /tmp/hygiene-report.json
          else
            python3 scripts/org-branch-hygiene.py --org qwickapps --dry-run --output /tmp/hygiene-report.json
          fi

      - name: Write job summary
        if: always()
        run: python3 scripts/org-branch-hygiene-summary.py /tmp/hygiene-report.json "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-pr-branch-cleanup-${{ github.run_id }}
          path: /tmp/hygiene-report.json
          retention-days: 30
          if-no-files-found: warn
