name: Secret Scan

# aos#198 (leak prevention, triggered by aos#191 committing 28 live
# credentials into a test fixture): a reusable, mergeable-only-if-clean gate
# for every repo's PRs. Scans the ADDED lines of the PR diff, plus the full
# content of any changed compressed file (.gz/.zip/.tar.gz/.tgz -- a diff
# never shows a compressed file's real content, only a binary marker).
#
# Deliberately has NO override input. A previous DB-reference gate in this
# repo (external-db-gate.yml) takes an `approved_external_db_label` input;
# this one does not, and should not gain one -- aos#198's acceptance
# criterion is that the gate blocks with no agent override.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  scan:
    name: Scan PR diff and changed compressed files for committed secrets
    runs-on: [self-hosted, Linux]
    # ci-workflows#184 precedent: this repo is public and runs on the
    # fleet's self-hosted runner. A fork PR must never execute its own
    # workflow-file/script changes directly on that host.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout ci-workflows (for the scanner script)
        uses: actions/checkout@v5
        with:
          repository: qwickapps/ci-workflows
          ref: main
          path: .ci-workflows-secret-scan

      - name: Scan added lines of the PR diff
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=100
          BASE_SHA="$(git merge-base "origin/${{ github.base_ref }}" "${{ github.sha }}")"
          git diff "${BASE_SHA}" "${{ github.sha }}" > /tmp/secret-scan.diff
          python3 .ci-workflows-secret-scan/scripts/lib/secret-scan.py --diff < /tmp/secret-scan.diff

      - name: Scan changed compressed files' real content
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=100
          BASE_SHA="$(git merge-base "origin/${{ github.base_ref }}" "${{ github.sha }}")"
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" "${{ github.sha }}" \
            | grep -E '\.(gz|zip|tar\.gz|tgz)$' || true)
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "no changed compressed files"
            exit 0
          fi
          python3 .ci-workflows-secret-scan/scripts/lib/secret-scan.py --paths "${changed[@]}"
