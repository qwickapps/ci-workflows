name: Secret Scan

# aos#198 leak prevention. This reusable gate has no override. Callers pin the
# reusable workflow SHA and pass that exact immutable SHA as ci_workflows_ref.

on:
  workflow_call:
    inputs:
      ci_workflows_ref:
        description: >-
          Full immutable commit SHA used by the caller's
          qwickapps/ci-workflows/.github/workflows/secret-scan.yml@ reference.
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Scan changed HEAD blobs for committed secrets
    runs-on: [self-hosted, choco]
    # This public repository's self-hosted runner must never execute a fork's
    # workflow/script changes. The same-repository PR restriction is explicit.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate immutable scanner revision
        env:
          CI_WORKFLOWS_REF: ${{ inputs.ci_workflows_ref }}
        run: |
          set -euo pipefail
          [[ "$CI_WORKFLOWS_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout scanner at the caller-pinned workflow revision
        uses: actions/checkout@v5
        with:
          repository: qwickapps/ci-workflows
          # The caller supplies the exact SHA after its `uses: ...@<SHA>`.
          # github.workflow_sha belongs to the caller workflow in a reusable
          # run, so it must not be used to resolve this repository.
          ref: ${{ inputs.ci_workflows_ref }}
          path: .ci-workflows-secret-scan

      - name: Materialize and scan every changed HEAD blob
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          bash .ci-workflows-secret-scan/scripts/secret-scan-head-blobs.sh \
            "$BASE_SHA" "$HEAD_SHA" \
            .ci-workflows-secret-scan/scripts/lib/secret-scan.py \
            "$GITHUB_WORKSPACE"
