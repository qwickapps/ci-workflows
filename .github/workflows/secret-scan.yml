name: Secret Scan

# aos#198 leak prevention. This reusable gate has no override. The `job` context
# identifies the immutable revision of the called workflow, unlike the caller-
# scoped `github` context.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  scan:
    name: Scan changed HEAD blobs for committed secrets
    runs-on: [self-hosted, julie]
    # This public repository's self-hosted runner must never execute a fork's
    # workflow/script changes. The same-repository PR restriction is explicit.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout scanner at this immutable reusable-workflow revision
        uses: actions/checkout@v5
        with:
          repository: qwickapps/ci-workflows
          # `github.workflow_sha` is from the external caller in a reusable
          # run. `job.workflow_sha` is the immutable SHA of this called
          # reusable workflow, so its scanner source matches reviewed logic.
          ref: ${{ job.workflow_sha }}
          path: .ci-workflows-secret-scan

      - name: Materialize and scan every changed HEAD blob
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          bash .ci-workflows-secret-scan/scripts/secret-scan-head-blobs.sh \
            "$BASE_SHA" "$HEAD_SHA" \
            .ci-workflows-secret-scan/scripts/lib/secret-scan.py \
            "$GITHUB_WORKSPACE"
