name: Deploy App LB Guard Case Tests

# Regression gate for ci-workflows#163: deploy-app.yml's "Verify LB target
# resolves to the node just deployed (infra#101 guard)" step (present in
# both deploy-caprover and deploy-stable) must not fail open (silently skip
# the safety check entirely) for a legitimately-cased Tailscale hostname.
#
# Tests:
#   bash scripts/tests/deploy-app-lb-guard-case.test.sh
#     - extracts the gate's actual embedded logic from this file (a real
#       YAML parse) and EXECUTES it under controlled inputs, asserting
#       whether it skips or proceeds -- a dynamic proof, not a string grep.

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-app.yml'
      - '.github/workflows/deploy-app-lb-guard-case-tests.yml'
      - 'scripts/tests/deploy-app-lb-guard-case.test.sh'
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/deploy-app.yml'
      - 'scripts/tests/deploy-app-lb-guard-case.test.sh'

permissions:
  contents: read

jobs:
  contract:
    name: deploy-app.yml LB guard case tests
    runs-on: [self-hosted, macmini]
    # ci-workflows#184: this repo is public and this job runs on the
    # fleet's self-hosted macmini runner. Without this guard, a
    # pull_request from a fork would execute its own workflow-file
    # changes (and step scripts) directly on that host. event_name is
    # checked first so push (this file's other trigger) is unaffected --
    # github.event.pull_request is only populated for pull_request events.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LB guard case contract test
        run: bash scripts/tests/deploy-app-lb-guard-case.test.sh
