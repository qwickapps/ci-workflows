name: Main Push Guard Tests

# Regression gate for qwickapps/ci-workflows#122: main-push-guard.yml's
# `on.workflow_call` block never re-exposed the build-push job's
# `image_ref`/`image_tag` outputs, so every consumer's
# `needs.<job>.outputs.image_ref` silently resolved to an empty string
# with no error. Traced live in qwickapps/mcp#333 — the resulting
# fallback path silently retagged a moving deploy tag on the wrong GHCR
# image repo for over two months. Nothing caught it because nothing
# tested this file's shape. This gate exists so a future edit that
# drops or breaks the `outputs` block fails loudly on the PR instead of
# silently reappearing.
#
# Also covers ci-workflows#139: the Test job hardcoded pnpm for every
# language: ts | js caller (npm install -g pnpm; pnpm install
# --frozen-lockfile unconditionally), which fails closed with
# ERR_PNPM_NO_LOCKFILE for every npm-only repo (confirmed: qwickapps/agents,
# qwickapps/projects). Detection now reads the checked-out lockfile instead
# of assuming.
#
# Tests:
#   bash scripts/tests/main-push-guard-outputs.test.sh
#     - on.workflow_call.outputs.image_ref/image_tag exist and are
#       wired to jobs.build-push.outputs.image_ref/image_tag
#   bash scripts/tests/main-push-guard-pkgmgr.test.sh
#     - package-manager detection picks pnpm/npm/fails loudly correctly
#       for pnpm-only, npm-only, both-lockfiles, and neither-lockfile repos

on:
  pull_request:
    paths:
      - '.github/workflows/main-push-guard.yml'
      - '.github/workflows/main-push-guard-tests.yml'
      - 'scripts/tests/main-push-guard-outputs.test.sh'
      - 'scripts/tests/main-push-guard-pkgmgr.test.sh'
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/main-push-guard.yml'
      - 'scripts/tests/main-push-guard-outputs.test.sh'
      - 'scripts/tests/main-push-guard-pkgmgr.test.sh'

permissions:
  contents: read

jobs:
  contract:
    name: main-push-guard.yml output contract tests
    runs-on: [self-hosted, macmini]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: |
          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            python3 -m pip install --user PyYAML
          fi

      - name: Run main-push-guard.yml output contract test
        run: bash scripts/tests/main-push-guard-outputs.test.sh

      - name: Run main-push-guard.yml package-manager detection test
        run: bash scripts/tests/main-push-guard-pkgmgr.test.sh
