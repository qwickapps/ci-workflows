name: Main Push Guard

# ci-workflows#175: thin wrapper. All logic lives in the reusable workflow so
# there is one place to fix this kind of bug instead of N per-repo copies.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    uses: qwickapps/ci-workflows/.github/workflows/main-push-guard-reusable.yml@main
    secrets: inherit
