name: Secret Scan Tests

# Regression gates for the scanner and its reusable-workflow blob materializer.

on:
  pull_request:
    paths:
      - 'scripts/lib/secret-scan.py'
      - 'scripts/secret-scan-head-blobs.sh'
      - 'scripts/tests/secret-scan.test.sh'
      - 'scripts/tests/secret-scan-workflow-integration.test.sh'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/secret-scan-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'scripts/lib/secret-scan.py'
      - 'scripts/secret-scan-head-blobs.sh'
      - 'scripts/tests/secret-scan.test.sh'
      - 'scripts/tests/secret-scan-workflow-integration.test.sh'

permissions:
  contents: read

jobs:
  test:
    name: secret-scan RED/QUIET and workflow integration tests
    runs-on: [interserver-x64, julie]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run scanner RED/QUIET tests
        run: bash scripts/tests/secret-scan.test.sh

      - name: Run reusable workflow materialization tests
        run: bash scripts/tests/secret-scan-workflow-integration.test.sh
