name: Secret Scan Tests

# Regression gate for scripts/lib/secret-scan.py (aos#198). See
# scripts/tests/secret-scan.test.sh's own header for the RED/QUIET
# assertion shape and why both matter.

on:
  pull_request:
    paths:
      - 'scripts/lib/secret-scan.py'
      - 'scripts/tests/secret-scan.test.sh'
      - '.github/workflows/secret-scan.yml'
      - '.github/workflows/secret-scan-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'scripts/lib/secret-scan.py'
      - 'scripts/tests/secret-scan.test.sh'

permissions:
  contents: read

jobs:
  test:
    name: secret-scan.py RED/QUIET tests
    runs-on: [self-hosted, macmini]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret-scan.py tests
        run: bash scripts/tests/secret-scan.test.sh
