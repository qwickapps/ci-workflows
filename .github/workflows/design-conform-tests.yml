name: Design Conform Tests

on:
  pull_request:
    paths:
      - '.github/runner-policy.json'
      - '.github/workflows/design-conform.yml'
      - '.github/workflows/design-conform-tests.yml'
      - 'scripts/design-conform/**'
      - 'scripts/tests/design-conform*'
      - 'scripts/tests/runner-policy.test.sh'
  push:
    branches: [main]
    paths:
      - '.github/runner-policy.json'
      - '.github/workflows/design-conform.yml'
      - '.github/workflows/design-conform-tests.yml'
      - 'scripts/design-conform/**'
      - 'scripts/tests/design-conform*'
      - 'scripts/tests/runner-policy.test.sh'

permissions:
  contents: read

jobs:
  test-design-conform:
    name: design-conform unit and browser tests
    runs-on: [interserver-x64, julie]
    # Self-hosted runner: never run fork-PR code (scripts/tests/self-hosted-fork-pr-guard.test.sh).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python with venv support
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned browser runtime
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/design-conform-test-venv"
          # PyYAML: scripts/runner-policy.py (run by the test script) imports yaml.
          "$RUNNER_TEMP/design-conform-test-venv/bin/python" -m pip install --disable-pip-version-check 'playwright==1.65.2' 'PyYAML==6.0.2'
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TOOL_CACHE/design-conform-playwright" \
            "$RUNNER_TEMP/design-conform-test-venv/bin/python" -m playwright install chromium

      - name: Run contract and browser tests
        env:
          DESIGN_CONFORM_BROWSER_TEST: '1'
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/design-conform-playwright
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/design-conform-test-venv/bin:$PATH"
          scripts/tests/design-conform-workflow.test.sh
