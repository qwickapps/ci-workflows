name: Deploy App (Reusable)

# Canonical 4-stage blue-green pipeline.
#
# Stage mapping:
# - build  -> oci-dev  / <app>-build  -> release-candidate
# - uat    -> oci-main / <app>-uat    -> release
# - live   -> oci-main / <app>-live   -> stable + route update
# - stable -> macmini  / <app>-stable
#
# All stages run on [self-hosted, macmini].
#
# Tag lineage (all on the same immutable digest):
#   <sha-image> -> release-candidate -> release -> stable
#
# Image is built once for the stage build input when no image_ref is provided.
# UAT/live/stable never rebuild; they retag forward only.

on:
  workflow_call:
    inputs:
      # -- Identity ------------------------------------------------------------
      app_name:
        description: 'Product/app slug (e.g. qwickapps-mcp)'
        type: string
        required: true

      environment:
        description: 'Target logical environment (used for env file lookup and compatibility with legacy callers)'
        type: string
        required: true

      stage:
        description: 'Deployment stage. One of build | uat | live | stable'
        type: string
        required: false
        default: 'build'

      # -- Build --------------------------------------------------------------
      dockerfile_path:
        description: 'Path to Dockerfile from repo root'
        type: string
        required: true

      package_json_path:
        description: 'Path to package.json for version extraction (when not dockerfile_only)'
        type: string
        default: ''

      dockerfile_only:
        description: 'Set true for Dockerfile-only builds'
        type: string
        default: 'false'

      workspace_packages:
        description: 'Comma-separated workspace packages to build before docker build'
        type: string
        default: 'schema,logging,auth,react-framework,auth-client,cms,server'

      image_ref:
        description: 'Image to deploy for this stage. If omitted for build, workflow builds one image; for uat/live/stable it will default to the prior immutable tag.'
        type: string
        default: ''

      container_port:
        description: 'Container port the app listens on'
        type: string
        required: true

      # -- Health ------------------------------------------------------------
      health_path:
        description: 'Health check endpoint (must start with /)'
        type: string
        required: true

      # -- CapRover ----------------------------------------------------------
      caprover_host:
        description: 'CapRover host fallback (e.g. captain.dev.qwickforge.com)'
        type: string
        required: true

      caprover_url:
        description: 'Optional explicit CapRover URL override'
        type: string
        default: ''

      # -- Public URLs -------------------------------------------------------
      public_url:
        description: 'Public-facing URL for smoke/e2e checks'
        type: string
        required: true

      # -- Misc -------------------------------------------------------------
      run_migrations:
        description: 'Whether to run migration checks (used by uat in this flow)'
        type: string
        default: 'false'

      run_e2e:
        description: 'Whether to run E2E after successful deploy'
        type: string
        default: 'false'

      smoke_test_path:
        description: 'Optional smoke test path'
        type: string
        default: ''

      smoke_test_command:
        description: 'Optional smoke-test command with APP_URL, HEALTH_PATH, IMAGE_REF, APP_NAME, ENV_LABEL'
        type: string
        default: ''

      # -- Subsystem health -----------------------------------------------
      critical_subsystems:
        description: 'Comma-separated critical subsystems'
        type: string
        default: 'postgres'

      warning_subsystems:
        description: 'Comma-separated warning subsystems'
        type: string
        default: ''

      prod_critical_subsystems:
        description: 'Subsystems promoted to critical in non-build stages'
        type: string
        default: ''

      # -- Gateway URL overrides -------------------------------------------
      gateway_live_url:
        description: 'Optional live backend URL override for qwickway route'
        type: string
        default: ''

      gateway_stable_url:
        description: 'Optional stable backend URL used for ordered fallback route'
        type: string
        default: ''

      # -- CMD override ----------------------------------------------------
      cmd:
        description: 'Container CMD override sent to configure-caprover-app'
        type: string
        default: ''

      # -- aos#193 Phase 1: blue-green SOP enforcement (additive) ----------
      e2e_command:
        description: >-
          Optional real end-to-end test command (login works, MCP/API calls
          return correct data -- HTTP 200 alone does NOT satisfy this, per
          the blue-green SOP) run against build/uat/live after a successful
          deploy, with the same env-var-injection pattern as
          smoke_test_command: APP_URL, HEALTH_PATH, IMAGE_REF, APP_NAME,
          ENV_LABEL. Unset = skipped, identical to today's behavior
          (aos#193 Phase 1 is purely additive; nothing runs unless a caller
          opts in).
        type: string
        default: ''

      require_live_approval_check:
        description: >-
          When true, deploy-stable requires exactly one
          blue-green/live-e2e-approved check run on the exact commit sha
          about to deploy, conclusion==success, plus a passing `aos
          directive verify` result over its embedded payload (aos#193
          Phase 1 §5). Default false preserves today's deploy-stable
          behavior exactly. NOTE: the signing bridge that would let a real
          directive get attached to that check run is not built yet
          (aos#193, latest comment) -- setting this true cannot succeed in
          production today and is not yet meant to be used there; it fails
          closed by design, not by omission.
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: qwickapps

jobs:
  # -- Stage resolution ------------------------------------------------------
  resolve-stage:
    runs-on: [self-hosted, macmini]
    outputs:
      stage: ${{ steps.meta.outputs.stage }}
      app_name: ${{ steps.meta.outputs.app_name }}
      env_label: ${{ steps.meta.outputs.env_label }}
      image_name: ${{ steps.meta.outputs.image_name }}
      source_image_ref: ${{ steps.meta.outputs.source_image_ref }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      prior_tag: ${{ steps.meta.outputs.prior_tag }}
      next_tag: ${{ steps.meta.outputs.next_tag }}
      target_app: ${{ steps.meta.outputs.target_app }}
      target_app_url: ${{ steps.meta.outputs.target_app_url }}
      gateway_app_name: ${{ steps.meta.outputs.gateway_app_name }}
      stable_app_url: ${{ steps.meta.outputs.stable_app_url }}
      caprover_host_name: ${{ steps.meta.outputs.caprover_host_name }}
      caprover_required: ${{ steps.meta.outputs.caprover_required }}
      run_migrations_for_stage: ${{ steps.meta.outputs.run_migrations_for_stage }}
      build_required: ${{ steps.meta.outputs.build_required }}
      canary: ${{ steps.meta.outputs.canary }}
      deploy_start_epoch: ${{ steps.meta.outputs.deploy_start_epoch }}
    steps:
      - name: Resolve canonical stage contract
        id: meta
        run: |
          set -euo pipefail

          # Captured first, before any TS registration/deploy work happens in
          # this run, so the infra#101 verify-ts-lb-target.sh freshness check
          # (post-promotion) can prove a live device was registered BY this
          # deploy and not a stale leftover from a previous one.
          echo "deploy_start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

          STAGE_INPUT="${{ inputs.stage }}"
          APP_NAME="${{ inputs.app_name }}"
          INPUT_IMAGE="${{ inputs.image_ref }}"

          case "$STAGE_INPUT" in
            build|uat|live|stable)
              ;;
            *)
              echo "ERROR: invalid stage '$STAGE_INPUT'"
              exit 1
              ;;
          esac

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: app_name is required"
            exit 1
          fi
          if [ -z "${{ inputs.container_port }}" ]; then
            echo "ERROR: container_port is required"
            exit 1
          fi
          if [ -z "${{ inputs.health_path }}" ]; then
            echo "ERROR: health_path is required"
            exit 1
          fi
          case "${{ inputs.health_path }}" in
            /*) ;;
            *)
              echo "ERROR: health_path must start with /"
              exit 1
              ;;
          esac

          # ci-workflows#153 check 1: stage/host agreement. `<app>-build`
          # must deploy to oci-dev; `<app>-uat`/`<app>-live`/`<app>-stable`
          # must deploy to oci-main. This is a caller-input check, not
          # derived from STAGE alone: TARGET_APP_URL below is computed
          # unconditionally from the canonical dev/app.qwickforge.com
          # pattern for informational (health-check) purposes, but the
          # actual CapRover deploy target is caprover_url/caprover_host,
          # both caller-supplied -- nothing upstream of this point validated
          # those against stage, which is exactly how faabzi-uat-build ended
          # up on oci-main.
          #
          # ci-workflows#187: `stable` used to be exempt from this check
          # entirely, on the reasoning that stable deployed through a
          # different, non-CapRover orchestrator (see deploy-stable job's
          # own header comment for that history), never through
          # deploy-caprover's caprover_required gate. That reasoning no
          # longer holds: deploy-stable now deploys through
          # CapRover using the caller's own caprover_host (mcp#392,
          # ci-workflows#186), so a caller passing a dev host for a stable
          # dispatch would send the stable slot to oci-dev with
          # OCI_DEV_CAPROVER_PASSWORD -- the exact failure mode this check
          # exists to prevent, just for a different stage. `stable` is now
          # mapped to the same canonical oci-main host uat/live already use,
          # instead of being exempted.
          CANONICAL_DEV_HOST="captain.dev.qwickforge.com"
          CANONICAL_MAIN_HOST="captain.app.qwickforge.com"
          normalize_host() {
            # DNS hostnames are case-insensitive; lowercase so a caller
            # passing e.g. Captain.App.QwickForge.Com still matches the
            # canonical lowercase host below.
            printf '%s' "$1" | sed -E 's#^[a-zA-Z]+://##' | sed -E 's#[:/].*$##' | tr '[:upper:]' '[:lower:]'
          }
          RESOLVED_HOST=""
          if [ -n "${{ inputs.caprover_url }}" ]; then
            RESOLVED_HOST="$(normalize_host "${{ inputs.caprover_url }}")"
          elif [ -n "${{ inputs.caprover_host }}" ]; then
            RESOLVED_HOST="$(normalize_host "${{ inputs.caprover_host }}")"
          fi
          case "$STAGE_INPUT" in
            build) EXPECTED_HOST="$CANONICAL_DEV_HOST" ;;
            uat|live|stable) EXPECTED_HOST="$CANONICAL_MAIN_HOST" ;;
            # Unreachable today -- STAGE_INPUT is validated to be one of
            # build|uat|live|stable above. Kept as an explicit fail-closed
            # arm so that if a stage is ever added to that allow-list
            # without also updating this mapping, the script dies with a
            # clear diagnostic instead of an "unbound variable" error from
            # set -u when $EXPECTED_HOST is referenced below unset.
            *)
              echo "ERROR: no canonical host mapping for stage '$STAGE_INPUT'"
              exit 1
              ;;
          esac
          if [ -z "$RESOLVED_HOST" ]; then
            echo "ERROR: stage '$STAGE_INPUT' requires caprover_host or caprover_url"
            exit 1
          fi
          if [ "$RESOLVED_HOST" != "$EXPECTED_HOST" ]; then
            echo "ERROR: stage '$STAGE_INPUT' must deploy to '$EXPECTED_HOST' (per the blue-green SOP, ci-workflows#153/#187: build->oci-dev, uat/live/stable->oci-main), but resolved host is '$RESOLVED_HOST'"
            exit 1
          fi

          if [ -n "$INPUT_IMAGE" ]; then
            IMAGE_BASE="$(printf '%s' "$INPUT_IMAGE" | sed 's/@.*$//' | sed -E 's/:[^:/]+$//')"
          fi
          if [ -z "${IMAGE_BASE:-}" ]; then
            IMAGE_BASE="${{ env.REGISTRY }}/${{ env.OWNER }}/img-${APP_NAME}"
          fi

          STAGE="$STAGE_INPUT"
          CANARY="false"
          CAPROVER_REQUIRED="true"

          case "$STAGE" in
            build)
              TARGET_APP="${APP_NAME}-build"
              TARGET_APP_URL="https://${APP_NAME}-build.dev.qwickforge.com"
              GATEWAY_APP_NAME="${APP_NAME}-dev"
              ENV_LABEL="dev"
              PRIOR_TAG=""
              NEXT_TAG="${IMAGE_BASE}:release-candidate"
              STABLE_APP_URL="${{ inputs.gateway_stable_url }}"
              RUN_MIGRATIONS_FOR_STAGE="false"
              # ci-workflows#161: lowercased, matching the RESOLVED_HOST
              # comparison above (ci-workflows#160) -- DNS hostnames are
              # case-insensitive, but this value feeds the downstream
              # dev/main credential-selection glob (deploy-caprover job)
              # case-sensitively. Without this, a mixed-case caprover_host
              # (e.g. "Captain.Dev.QwickForge.Com") passes check 1's
              # comparison fine but then selects OCI_MAIN_CAPROVER_PASSWORD
              # instead of OCI_DEV_CAPROVER_PASSWORD downstream. Note: unlike
              # #163's RAW_URL_LOWER fix, this lowercases the ACTUAL value
              # used as the CapRover connection target on the
              # no-caprover_url-override path, not just a comparison copy --
              # acknowledged per #163's review note; believed benign since
              # DNS/HTTP host matching is itself case-insensitive, but a more
              # surgical (comparison-only) fix was deliberately not pursued
              # here to avoid re-touching an already-merged, already-tested
              # assignment for a cosmetic-only concern.
              CAPROVER_HOST_NAME="$(printf '%s' "${{ inputs.caprover_host }}" | tr '[:upper:]' '[:lower:]')"
              ;;
            uat)
              TARGET_APP="${APP_NAME}-uat"
              TARGET_APP_URL="https://${APP_NAME}-uat.app.qwickforge.com"
              GATEWAY_APP_NAME="${APP_NAME}-uat"
              ENV_LABEL="uat"
              PRIOR_TAG="${IMAGE_BASE}:release-candidate"
              NEXT_TAG="${IMAGE_BASE}:release"
              STABLE_APP_URL="${{ inputs.gateway_stable_url }}"
              RUN_MIGRATIONS_FOR_STAGE="${{ inputs.run_migrations }}"
              # ci-workflows#161: lowercased, matching the RESOLVED_HOST
              # comparison above (ci-workflows#160) -- DNS hostnames are
              # case-insensitive, but this value feeds the downstream
              # dev/main credential-selection glob (deploy-caprover job)
              # case-sensitively. Without this, a mixed-case caprover_host
              # (e.g. "Captain.Dev.QwickForge.Com") passes check 1's
              # comparison fine but then selects OCI_MAIN_CAPROVER_PASSWORD
              # instead of OCI_DEV_CAPROVER_PASSWORD downstream. Note: unlike
              # #163's RAW_URL_LOWER fix, this lowercases the ACTUAL value
              # used as the CapRover connection target on the
              # no-caprover_url-override path, not just a comparison copy --
              # acknowledged per #163's review note; believed benign since
              # DNS/HTTP host matching is itself case-insensitive, but a more
              # surgical (comparison-only) fix was deliberately not pursued
              # here to avoid re-touching an already-merged, already-tested
              # assignment for a cosmetic-only concern.
              CAPROVER_HOST_NAME="$(printf '%s' "${{ inputs.caprover_host }}" | tr '[:upper:]' '[:lower:]')"
              ;;
            live)
              TARGET_APP="${APP_NAME}-live"
              TARGET_APP_URL="https://${APP_NAME}-live.app.qwickforge.com"
              GATEWAY_APP_NAME="${APP_NAME}"
              ENV_LABEL="live"
              PRIOR_TAG="${IMAGE_BASE}:release"
              NEXT_TAG="${IMAGE_BASE}:stable"
              STABLE_APP_URL="${{ inputs.gateway_stable_url }}"
              RUN_MIGRATIONS_FOR_STAGE="false"
              # ci-workflows#161: lowercased, matching the RESOLVED_HOST
              # comparison above (ci-workflows#160) -- DNS hostnames are
              # case-insensitive, but this value feeds the downstream
              # dev/main credential-selection glob (deploy-caprover job)
              # case-sensitively. Without this, a mixed-case caprover_host
              # (e.g. "Captain.Dev.QwickForge.Com") passes check 1's
              # comparison fine but then selects OCI_MAIN_CAPROVER_PASSWORD
              # instead of OCI_DEV_CAPROVER_PASSWORD downstream. Note: unlike
              # #163's RAW_URL_LOWER fix, this lowercases the ACTUAL value
              # used as the CapRover connection target on the
              # no-caprover_url-override path, not just a comparison copy --
              # acknowledged per #163's review note; believed benign since
              # DNS/HTTP host matching is itself case-insensitive, but a more
              # surgical (comparison-only) fix was deliberately not pursued
              # here to avoid re-touching an already-merged, already-tested
              # assignment for a cosmetic-only concern.
              CAPROVER_HOST_NAME="$(printf '%s' "${{ inputs.caprover_host }}" | tr '[:upper:]' '[:lower:]')"
              ;;
            stable)
              TARGET_APP="${APP_NAME}-stable"
              TARGET_APP_URL="${{ inputs.gateway_stable_url }}"
              GATEWAY_APP_NAME="${APP_NAME}"
              ENV_LABEL="stable"
              PRIOR_TAG="${IMAGE_BASE}:stable"
              NEXT_TAG=""
              STABLE_APP_URL="${{ inputs.gateway_stable_url }}"
              RUN_MIGRATIONS_FOR_STAGE="false"
              CAPROVER_REQUIRED="false"
              # ci-workflows#161: lowercased, matching the RESOLVED_HOST
              # comparison above (ci-workflows#160) -- DNS hostnames are
              # case-insensitive, but this value feeds the downstream
              # dev/main credential-selection glob (deploy-caprover job)
              # case-sensitively. Without this, a mixed-case caprover_host
              # (e.g. "Captain.Dev.QwickForge.Com") passes check 1's
              # comparison fine but then selects OCI_MAIN_CAPROVER_PASSWORD
              # instead of OCI_DEV_CAPROVER_PASSWORD downstream. Note: unlike
              # #163's RAW_URL_LOWER fix, this lowercases the ACTUAL value
              # used as the CapRover connection target on the
              # no-caprover_url-override path, not just a comparison copy --
              # acknowledged per #163's review note; believed benign since
              # DNS/HTTP host matching is itself case-insensitive, but a more
              # surgical (comparison-only) fix was deliberately not pursued
              # here to avoid re-touching an already-merged, already-tested
              # assignment for a cosmetic-only concern.
              CAPROVER_HOST_NAME="$(printf '%s' "${{ inputs.caprover_host }}" | tr '[:upper:]' '[:lower:]')"
              ;;
          esac

          # ci-workflows#153 check 2: no per-environment build slots. A
          # CapRover app name matching -(uat|live|stable)-build$ is refused
          # outright -- `<app>-build` is the only legal build slot. The case
          # block above can only ever produce this shape if a caller passes
          # an app_name that already carries an environment suffix (e.g.
          # app_name: "myapp-uat" with stage=build), so this is a defensive
          # check on the final computed slot name, not on app_name alone.
          #
          # Matched case-insensitively: app_name is a free-form string input
          # with no pattern constraint and is never lowercased elsewhere in
          # this file, so app_name="faabzi-UAT" (or any other non-lowercase
          # casing of the uat/live/stable suffix) would otherwise bypass this
          # lowercase-only glob and reproduce the exact faabzi-uat-build
          # incident this check exists to prevent, just with different
          # casing (found in adversarial review of ci-workflows#157).
          TARGET_APP_LC="$(printf '%s' "$TARGET_APP" | tr '[:upper:]' '[:lower:]')"
          case "$TARGET_APP_LC" in
            *-uat-build|*-live-build|*-stable-build)
              echo "ERROR: computed CapRover app name '$TARGET_APP' is a per-environment build slot, forbidden by the blue-green SOP (ci-workflows#153) -- '<app>-build' is the only legal build slot; app_name must not itself carry an environment suffix"
              exit 1
              ;;
          esac

          if [ -z "$TARGET_APP_URL" ]; then
            TARGET_APP_URL="http://${APP_NAME}-${STAGE}.taile324e7.ts.net:8080"
          fi

          if [ "$STAGE" = "stable" ] && [ -z "$STABLE_APP_URL" ]; then
            STABLE_APP_URL="http://${APP_NAME}-stable.taile324e7.ts.net:8080"
          fi

          if [ -z "$INPUT_IMAGE" ]; then
            if [ "$STAGE" = "build" ]; then
              IMAGE_TAG="sha-${GITHUB_SHA:0:12}"
              if [ "${{ inputs.dockerfile_only }}" = "false" ] && [ -z "${{ inputs.package_json_path }}" ]; then
                echo "ERROR: package_json_path required unless dockerfile_only=true"
                exit 1
              fi
              IMAGE_REF="${IMAGE_BASE}:${IMAGE_TAG}"
              BUILD_REQUIRED="true"
            else
              IMAGE_REF="${PRIOR_TAG}"
              BUILD_REQUIRED="false"
            fi
          else
            IMAGE_REF="$INPUT_IMAGE"
            BUILD_REQUIRED="false"
          fi

          if [ -z "$IMAGE_REF" ]; then
            echo "ERROR: resolved image_ref is empty"
            exit 1
          fi

          echo "stage=${STAGE}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "env_label=${ENV_LABEL}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "source_image_ref=${INPUT_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "prior_tag=${PRIOR_TAG}" >> "$GITHUB_OUTPUT"
          echo "next_tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "target_app=${TARGET_APP}" >> "$GITHUB_OUTPUT"
          echo "target_app_url=${TARGET_APP_URL}" >> "$GITHUB_OUTPUT"
          echo "gateway_app_name=${GATEWAY_APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "stable_app_url=${STABLE_APP_URL}" >> "$GITHUB_OUTPUT"
          echo "caprover_host_name=${CAPROVER_HOST_NAME}" >> "$GITHUB_OUTPUT"
          echo "caprover_required=${CAPROVER_REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "run_migrations_for_stage=${RUN_MIGRATIONS_FOR_STAGE}" >> "$GITHUB_OUTPUT"
          echo "build_required=${BUILD_REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "canary=${CANARY}" >> "$GITHUB_OUTPUT"

  # -- Immutable env var gate -----------------------------------------------
  validate-env:
    needs: [resolve-stage]
    runs-on: [self-hosted, macmini]
    steps:
      - name: Download rendered env file artifact (if present)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-env-${{ inputs.environment }}-${{ inputs.app_name }}
          path: .deploy-app-env

      - name: Resolve env file path
        id: env-file
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          STAGE_LABEL="${{ needs.resolve-stage.outputs.env_label }}"
          APP="${{ inputs.app_name }}"

          for candidate in \
            ".deploy-app-env/app-env-${ENV}-${APP}.env" \
            ".deploy-app-env/app-env-${STAGE_LABEL}-${APP}.env" \
            "/tmp/app-env-${ENV}-${APP}.env" \
            "/tmp/app-env-${STAGE_LABEL}-${APP}.env" \
            "/tmp/app-env-${APP}.env"; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::env file not found for app=${APP} env=${ENV} stage=${STAGE_LABEL}"
          exit 1

      - name: Checkout ci-workflows scripts
        uses: actions/checkout@v4
        with:
          repository: qwickapps/ci-workflows
          ref: main
          path: .ci-workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Make scripts executable
        run: chmod +x .ci-workflows/scripts/*.sh

      - name: Validate rendered env values (required for all stages)
        run: |
          set -euo pipefail
          ENV_FILE="${{ steps.env-file.outputs.path }}"

          .ci-workflows/scripts/validate-env-values.sh "$ENV_FILE"

  # -- Build once per image_ref ---------------------------------------------
  build:
    needs: [resolve-stage]
    if: ${{ needs.resolve-stage.outputs.stage == 'build' && needs.resolve-stage.outputs.build_required == 'true' }}
    runs-on: [self-hosted, macmini]
    # ci-workflows#137: this job's two GHCR-login steps fall back to
    # secrets.GITHUB_TOKEN when GHCR_PUSH_TOKEN/GHCR_PULL_TOKEN are unset or
    # stale. Without an explicit permissions block, GITHUB_TOKEN gets the
    # org/repo default, which does not include package access on this org --
    # the fallback was silent dead code, and this exact gap (#136 not being
    # sufficient on its own) blocked qwickapps/forge#251/#253/#250 from
    # deploying for 8+ hours. contents: read matches actions/checkout's
    # existing implicit default (additive, not restrictive); packages: write
    # covers both the pull-only login and the later push.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.dockerfile_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        if: inputs.dockerfile_only != 'true'
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install dependencies
        if: inputs.dockerfile_only != 'true'
        run: pnpm install --no-frozen-lockfile --store-dir .pnpm-store

      - name: Build workspace packages
        if: inputs.workspace_packages != ''
        run: |
          CLIENT_DIR="$(dirname '${{ inputs.dockerfile_path }}')"
          .github/scripts/build-workspace-package.sh \
            --product "$CLIENT_DIR" \
            --packages "${{ inputs.workspace_packages }}"

      - name: Ensure Docker endpoint
        run: |
          chmod +x .github/scripts/resolve-docker-endpoint.sh
          .github/scripts/resolve-docker-endpoint.sh

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_CONFIG="${RUNNER_TEMP}/.docker-persistent"
          mkdir -p "$DOCKER_CONFIG"
          AUTH_B64=$(printf '%s:%s' "${{ github.actor }}" "$GHCR_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH_B64" > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "GHCR credentials wrote to $DOCKER_CONFIG/config.json"

      - name: Clean up stale buildx builders
        run: |
          docker ps -a --filter name=buildx_buildkit_ --format '{{.Names}}' | xargs -r docker rm -f 2>/dev/null || true
          docker buildx rm --all-inactive --force 2>/dev/null || true

      - name: Login to GHCR for base image pull
        run: |
          _cli="${DOCKER_CLI:-docker}"
          echo "$GHCR_TOKEN" | "$_cli" login ghcr.io -u "${{ github.actor }}" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          DOCKER_CLI: ${{ env.DOCKER_CLI }}
          DOCKER_CONFIG: ${{ runner.temp }}/.docker-persistent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ needs.resolve-stage.outputs.image_ref }}

  # -- Provenance gate (all stages require stage image; non-build requires prior)
  verify-provenance:
    needs: [resolve-stage, build, validate-env]
    if: |
      always() &&
      needs.resolve-stage.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, macmini]
    # ci-workflows#137: same GITHUB_TOKEN-fallback gap as the build job, but
    # this job never checks out the repo (no actions/checkout step) and only
    # pulls/inspects images -- packages: read is enough, no contents: read.
    permissions:
      packages: read
    steps:
      - name: Write GHCR credentials directly (bypasses osxkeychain on headless runner)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # runner.temp isn't usable in a job-level env: block (GitHub rejects
          # the whole reusable workflow at load time), so DOCKER_CONFIG is
          # computed here and exported via GITHUB_ENV instead -- same pattern
          # the build and retag jobs already use below.
          #
          # This exact path is also recomputed independently (not read back
          # from $DOCKER_CONFIG) by the cleanup step below -- actions-runner-
          # critical-macmini's own .env sets a persistent, ambient
          # DOCKER_CONFIG for this runner. If this step fails on any line
          # before its GITHUB_ENV export (mkdir/symlink/printf), that export
          # never runs, so $DOCKER_CONFIG in every later step -- including
          # the always()-run cleanup step -- would silently fall back to the
          # runner's own ambient value instead of this job's temp one, and a
          # naive `rm -rf "$DOCKER_CONFIG"` would delete the runner's real
          # Docker config for every job that ever runs there. Recomputing
          # the same deterministic path independently in cleanup means it
          # never depends on this export having succeeded.
          DOCKER_CONFIG="${RUNNER_TEMP}/ghcr-docker-config-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          # umask 077: this runner is shared (self-hosted, macmini) -- the
          # default mode would leave config.json (containing a GHCR token)
          # world/group-readable to every other job/user on the same box.
          umask 077
          mkdir -p "$DOCKER_CONFIG/cli-plugins"
          # Symlink buildx so docker buildx works under the overridden DOCKER_CONFIG
          if [ -f "$HOME/.docker/cli-plugins/docker-buildx" ]; then
            ln -sf "$HOME/.docker/cli-plugins/docker-buildx" "$DOCKER_CONFIG/cli-plugins/docker-buildx"
          fi
          AUTH_B64=$(printf '%s:%s' "${{ github.actor }}" "$GHCR_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH_B64" > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Check image references exist
        run: |
          set -euo pipefail
          STAGE="${{ needs.resolve-stage.outputs.stage }}"
          IMAGE_REF="${{ needs.resolve-stage.outputs.image_ref }}"
          PRIOR_TAG="${{ needs.resolve-stage.outputs.prior_tag }}"

          docker buildx imagetools inspect "$IMAGE_REF" >/dev/null

          if [ "$STAGE" != "build" ]; then
            if [ -z "$PRIOR_TAG" ]; then
              echo "ERROR: prior tag is required for stage '$STAGE'"
              exit 1
            fi
            docker buildx imagetools inspect "$PRIOR_TAG" >/dev/null
          fi
      - name: Remove GHCR credentials
        if: always()
        run: |
          # Deliberately NOT reading $DOCKER_CONFIG here -- see the comment
          # in the credential step above. This recomputes the exact same
          # deterministic path independently, so a credential step that
          # failed before exporting DOCKER_CONFIG can never cause this to
          # delete the runner's own ambient DOCKER_CONFIG. The case guard
          # is a second, independent line of defense against ever deleting
          # anything outside RUNNER_TEMP, even under a future refactor.
          set -euo pipefail
          TARGET="${RUNNER_TEMP:?RUNNER_TEMP not set}/ghcr-docker-config-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          case "$TARGET" in
            "$RUNNER_TEMP"/*) rm -rf "$TARGET" ;;
            *) echo "::error::refusing to delete outside RUNNER_TEMP: $TARGET"; exit 1 ;;
          esac

  # -- CapRover deployment --------------------------------------------
  deploy-caprover:
    needs: [resolve-stage, validate-env, verify-provenance, build]
    if: |
      always() &&
      needs.resolve-stage.result == 'success' &&
      needs.validate-env.result == 'success' &&
      needs.verify-provenance.result == 'success' &&
      needs.resolve-stage.outputs.caprover_required == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, macmini]
    # aos#193 Phase 1 review (round 2): this job deliberately carries NO
    # explicit `permissions:` block, exactly matching this job's state
    # before aos#193 Phase 1 -- do not add one, including `checks:
    # write`/`packages: read` for the first-deploy-proof feature below,
    # without first landing the Phase 1b follow-up described here.
    #
    # Why: a reusable-workflow job's requested permissions must be a
    # SUBSET of what the calling workflow itself grants, and GitHub
    # validates this for the WHOLE workflow_call at dispatch time -- not
    # lazily per job, and NOT skipped for a job whose `if:` would
    # evaluate false. Confirmed empirically for this exact PR (not just
    # from ci-workflows#138/qwickapps/forge#254's prior incident, itself
    # about an unconditional job): a throwaway reusable-workflow probe
    # with a second job carrying `permissions: {checks: write}` gated
    # behind `if: ${{ inputs.enable_gated }}` (default false, never
    # evaluating true) still produced `conclusion: startup_failure` with
    # zero jobs created, from a caller granting only `contents: read`.
    # None of the 14 org workflows that call deploy-app.yml currently
    # grant `checks` at all, so adding it here -- even behind an `if:` --
    # would break build/uat/live for every one of them the moment this
    # merged, not just for callers that opt into
    # require_live_approval_check.
    #
    # The first-deploy-proof step group below (gated behind
    # require_live_approval_check == true, itself off by default and
    # already documented as "cannot succeed in production today") needs
    # packages: read and checks: write/read to do its job. Until the
    # required Phase 1b follow-up lands `checks: write`/`packages: read`
    # (or broader) in all 14 callers' own top-level permissions -- so this
    # job can legally request them back down -- any caller that opts in
    # early gets a clear, expected, fail-closed error from the
    # checks-API-touching steps (create-blue-green-check-run.sh's
    # --on-permission-denied, or check-first-deploy-proof.sh's own
    # hard-failure-on-query-error path), never a silent bypass.
    concurrency:
      group: caprover-deploy-${{ inputs.app_name }}-${{ needs.resolve-stage.outputs.stage }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ci-workflows scripts
        uses: actions/checkout@v4
        with:
          repository: qwickapps/ci-workflows
          ref: main
          path: .ci-workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Resolve CapRover credentials
        run: |
          STAGE="${{ needs.resolve-stage.outputs.stage }}"

          if [ -n "${{ inputs.caprover_url }}" ]; then
            CP_URL="${{ inputs.caprover_url }}"
          else
            CP_URL="${{ needs.resolve-stage.outputs.caprover_host_name }}"
          fi

          if [ -z "$CP_URL" ] || [ "$CP_URL" = "null" ]; then
            CP_URL="https://${{ needs.resolve-stage.outputs.caprover_host_name }}"
          fi

          # Ensure scheme is present — caprover_host inputs are bare hostnames
          case "$CP_URL" in
            http://*|https://*) ;;
            *) CP_URL="https://$CP_URL" ;;
          esac

          # Derive password from the CapRover URL (not stage), so callers that
          # override caprover_host get the correct credential regardless of stage.
          # dev.qwickforge.com → OCI_DEV; everything else → OCI_MAIN.
          #
          # ci-workflows#161: matched case-insensitively. DNS hostnames are
          # case-insensitive (same principle as ci-workflows#160's
          # normalize_host lowercasing), but this glob wasn't -- a caller
          # passing a mixed-case caprover_url directly (bypassing
          # caprover_host_name entirely, so lowercasing only that output
          # would have missed this path) selected OCI_MAIN_CAPROVER_PASSWORD
          # for a host that was actually dev, just spelled with capitals.
          CP_URL_LOWER="$(printf '%s' "$CP_URL" | tr '[:upper:]' '[:lower:]')"
          case "$CP_URL_LOWER" in
            *dev.qwickforge.com*)
              CP_PASS="${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}"
              ;;
            *)
              CP_PASS="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
              ;;
          esac

          if [ -z "$CP_PASS" ] || [ -z "$CP_URL" ]; then
            echo "ERROR: CapRover credentials missing for stage ${STAGE} url ${CP_URL}"
            exit 1
          fi

          {
            echo "CAPROVER_URL=$CP_URL"
            echo "CAPROVER_PASSWORD=$CP_PASS"
            echo "GHCR_PULL_TOKEN=${{ secrets.GHCR_PULL_TOKEN }}"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$CP_PASS"

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh
          chmod +x .ci-workflows/scripts/*.sh

      - name: Download rendered env file artifact (if present)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-env-${{ inputs.environment }}-${{ inputs.app_name }}
          path: .deploy-app-env

      - name: Resolve env file path
        id: env-file
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          STAGE_LABEL="${{ needs.resolve-stage.outputs.env_label }}"
          APP="${{ inputs.app_name }}"

          for candidate in \
            ".deploy-app-env/app-env-${ENV}-${APP}.env" \
            ".deploy-app-env/app-env-${STAGE_LABEL}-${APP}.env" \
            "/tmp/app-env-${ENV}-${APP}.env" \
            "/tmp/app-env-${STAGE_LABEL}-${APP}.env" \
            "/tmp/app-env-${APP}.env"; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::env file not found for app=${APP} env=${ENV} stage=${STAGE_LABEL}"
          exit 1

      - name: Check first-deploy proof (aos#193 Phase 1 §2)
        # aos#193 review finding #2: gated behind require_live_approval_check
        # == true (in addition to stage == 'live'), the SAME opt-in the rest
        # of this Phase 1 feature already uses and that's already documented
        # as "cannot succeed in production today, fails closed by design" --
        # not just stage == 'live' alone. Every one of the 14 current
        # callers never sets require_live_approval_check, so this step, the
        # 3 API calls it makes, and the branch below that would otherwise
        # skip the unconditional stable-health check are entirely unreached
        # for them: their live deploy is byte-for-byte identical to before
        # this feature existed.
        #
        # Runs BEFORE the CapRover credential step's password is needed
        # elsewhere, but AFTER it has already exported
        # CAPROVER_URL/CAPROVER_PASSWORD into $GITHUB_ENV above, so both are
        # available here as plain env vars.
        id: first-deploy-proof
        if: needs.resolve-stage.outputs.stage == 'live' && inputs.require_live_approval_check == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # aos#193 review finding #3: the real GHCR package name comes
          # from resolve-stage's own image_name output (already correctly
          # resolved for every caller, including ones whose real image
          # name differs from a derived "img-<app_name>" string, e.g.
          # mcp's img-qwickapps-mcp-prod or secrets' img-secrets) -- never
          # reconstructed here. image_name is the full "registry/owner/pkg"
          # path; the GH Packages API wants just the trailing package-name
          # segment.
          IMAGE_BASE="${{ needs.resolve-stage.outputs.image_name }}"
          GHCR_PACKAGE_NAME="${IMAGE_BASE##*/}"
          .ci-workflows/scripts/check-first-deploy-proof.sh \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --stable-app-name "${{ inputs.app_name }}-stable" \
            --github-token "$GH_TOKEN" \
            --owner "${{ env.OWNER }}" \
            --repo "${{ github.repository }}" \
            --app-name "${{ inputs.app_name }}" \
            --image-name "$GHCR_PACKAGE_NAME" \
            --commit-sha "${{ github.sha }}"

      - name: Ensure stable slot is up for live promotion
        # aos#193 Phase 1 §2: a first-deploy claim is allowed ONLY when the
        # caller opted into require_live_approval_check AND
        # check-first-deploy-proof.sh found ALL THREE of
        # CapRover-app-absence, GHCR release/stable-tag-history-absence,
        # and first-deploy-used-marker-absence -- every one of those is
        # queried directly from CapRover/GHCR/GitHub above, not asserted by
        # any input. When the opt-in is off (today's default for all 14
        # callers) or even one signal indicates "already deployed before",
        # this runs the exact same unconditional health check that ran here
        # unconditionally before this feature existed -- nothing about
        # today's non-opted-in behavior is altered.
        if: needs.resolve-stage.outputs.stage == 'live' && (inputs.require_live_approval_check != true || steps.first-deploy-proof.outputs.first_deploy != 'true')
        run: |
          set -euo pipefail
          STABLE_URL="${{ needs.resolve-stage.outputs.stable_app_url }}"
          if [ -z "$STABLE_URL" ]; then
            echo "ERROR: stable_app_url is required for live stage"
            exit 1
          fi
          for attempt in $(seq 1 10); do
            echo "Attempt $attempt checking stable slot"
            if curl -kfsS --max-time 3 "${STABLE_URL}${{ inputs.health_path }}" >/dev/null 2>&1; then
              echo "Stable slot is healthy at ${STABLE_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: stable slot not healthy at ${STABLE_URL}"
          exit 1

      - name: First deploy allowed (no stable slot to check yet)
        if: needs.resolve-stage.outputs.stage == 'live' && inputs.require_live_approval_check == true && steps.first-deploy-proof.outputs.first_deploy == 'true'
        run: |
          echo "First-deploy proof satisfied (CapRover app absent, no GHCR release/stable tag history, no first-deploy-used marker) -- skipping the stable-health precondition for this app's very first live promotion (aos#193 Phase 1 §2)."

      - name: Configure target slot (atomic env + config)
        run: |
          set -euo pipefail
          APP="${{ needs.resolve-stage.outputs.app_name }}"
          ENV="${{ needs.resolve-stage.outputs.env_label }}"
          TARGET_APP="${{ needs.resolve-stage.outputs.target_app }}"
          ENV_FILE="${{ steps.env-file.outputs.path }}"

          CMD_ARGS=()
          if [ "${{ inputs.cmd }}" = "__clear__" ]; then
            CMD_ARGS+=(--cmd "")
          elif [ -n "${{ inputs.cmd }}" ]; then
            CMD_ARGS+=(--cmd "${{ inputs.cmd }}")
          fi

          # Use canonical configure script from ci-workflows (not the caller's copy).
          # This guarantees the anti-wipe fix (single atomic update) applies to every
          # app that uses this reusable workflow, not just MCP.
          .ci-workflows/scripts/configure-caprover-app.sh \
            --app-name "$TARGET_APP" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --container-port "${{ inputs.container_port }}" \
            --env-file "$ENV_FILE" \
            "${CMD_ARGS[@]+"${CMD_ARGS[@]}"}"

      - name: Deploy image to target slot
        run: |
          .github/scripts/deploy-from-ghcr.sh \
            --app-name "${{ needs.resolve-stage.outputs.target_app }}" \
            --image-ref "${{ needs.resolve-stage.outputs.image_ref }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --github-token "$GHCR_PULL_TOKEN" \
            --github-owner "${{ env.OWNER }}"

      - name: Validate target slot health
        run: |
          .github/scripts/validate-deployment-health.sh \
            --app-name "${{ needs.resolve-stage.outputs.target_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --app-url "${{ needs.resolve-stage.outputs.target_app_url }}" \
            --health-path "${{ inputs.health_path }}" \
            --max-attempts 15 \
            --sleep 20

      - name: Deep subsystem health check
        run: |
          EFFECTIVE_CRITICAL="${{ inputs.critical_subsystems }}"
          EFFECTIVE_WARNING="${{ inputs.warning_subsystems }}"
          PROD_CRITICAL="${{ inputs.prod_critical_subsystems }}"
          ENV_CTX="${{ needs.resolve-stage.outputs.stage }}"

          if [ -n "$PROD_CRITICAL" ] && [ "$ENV_CTX" != "build" ]; then
            if [ -n "$EFFECTIVE_CRITICAL" ]; then
              EFFECTIVE_CRITICAL="${EFFECTIVE_CRITICAL},${PROD_CRITICAL}"
            else
              EFFECTIVE_CRITICAL="$PROD_CRITICAL"
            fi
          fi

          ARGS=(--url "${{ needs.resolve-stage.outputs.target_app_url }}${{ inputs.health_path }}" --timeout 15 --max-attempts 3 --sleep 10)
          if [ -n "$EFFECTIVE_CRITICAL" ]; then
            ARGS+=(--critical-subsystems "$EFFECTIVE_CRITICAL")
          fi
          if [ -n "$EFFECTIVE_WARNING" ]; then
            ARGS+=(--warning-subsystems "$EFFECTIVE_WARNING")
          fi
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            ARGS+=(--summary-file "$GITHUB_STEP_SUMMARY")
          fi
          .github/scripts/deep-health-check.sh "${ARGS[@]}"

      - name: Smoke test path
        if: inputs.smoke_test_path != ''
        run: |
          set -euo pipefail
          SMOKE_URL="${{ needs.resolve-stage.outputs.target_app_url }}${{ inputs.smoke_test_path }}"
          for attempt in $(seq 1 3); do
            STATUS=$(curl -ksS -o /dev/null -w "%{http_code}" --max-time 15 "$SMOKE_URL" || echo 000)
            echo "  Attempt $attempt: $STATUS"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: smoke test failed for $SMOKE_URL"
          exit 1

      - name: Smoke test command
        if: inputs.smoke_test_command != ''
        env:
          APP_URL: ${{ needs.resolve-stage.outputs.target_app_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
          IMAGE_REF: ${{ needs.resolve-stage.outputs.image_ref }}
          APP_NAME: ${{ inputs.app_name }}
          ENV_LABEL: ${{ needs.resolve-stage.outputs.env_label }}
        run: |
          set -euo pipefail
          ${{ inputs.smoke_test_command }}

      - name: Run migration check
        if: needs.resolve-stage.outputs.run_migrations_for_stage == 'true'
        run: |
          set -euo pipefail
          if [ -x .github/scripts/check-migrations.sh ]; then
            .github/scripts/check-migrations.sh
          elif [ -x .github/scripts/run-migrations.sh ]; then
            .github/scripts/run-migrations.sh
          else
            echo "WARNING: migration check enabled but no migration script is available"
          fi

      - name: Optional E2E
        if: inputs.run_e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Optional E2E dependencies
        if: inputs.run_e2e == 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --no-frozen-lockfile --store-dir .pnpm-store
          pnpm playwright test --config=playwright.ci.config.ts --project=chromium --grep="smoke|home|health" --timeout=60000 --reporter=line tests/e2e/

      - name: Real E2E command (aos#193 Phase 1 §3)
        # Distinct from smoke_test_command/run_e2e above: the SOP is
        # explicit that HTTP 200 / "landing page loads" does not count --
        # e2e_command is meant for a real functional suite (login works,
        # MCP/API calls return correct data). Runs whenever the caller sets
        # e2e_command, at every stage this job handles (build/uat/live),
        # same as smoke_test_command already does -- unset (today's
        # default for every current caller) skips this entirely.
        id: e2e-command
        if: inputs.e2e_command != ''
        env:
          APP_URL: ${{ needs.resolve-stage.outputs.target_app_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
          IMAGE_REF: ${{ needs.resolve-stage.outputs.image_ref }}
          APP_NAME: ${{ inputs.app_name }}
          ENV_LABEL: ${{ needs.resolve-stage.outputs.env_label }}
          # aos#193 review finding #5 (LOW): read via an env var for the
          # digest computation below, never re-interpolated a second time
          # via ${{ inputs.e2e_command }} inside a double-quoted printf
          # argument -- a command string containing a literal `"` would
          # break that line's quoting (after e2e already passed, so it's a
          # real footgun: a green e2e run followed by a broken digest
          # step). The FIRST use of inputs.e2e_command below (as the
          # literal command executed) is unaffected -- it is meant to be
          # interpolated as raw shell, same as smoke_test_command already
          # is elsewhere in this file.
          E2E_COMMAND: ${{ inputs.e2e_command }}
        run: |
          set -euo pipefail
          ${{ inputs.e2e_command }}
          # e2e_digest binds the live-e2e-approved record (below) to the
          # e2e run that actually happened, not just to a claim that
          # something ran -- sha256 of what was validated (command +
          # image_ref + the commit it ran against), not of secret output.
          E2E_DIGEST="$(printf '%s' "${E2E_COMMAND}|${IMAGE_REF}|${{ github.sha }}" | sha256sum | awk '{print $1}')"
          echo "e2e_digest=sha256:${E2E_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create live-e2e-approved check run (aos#193 Phase 1 §1)
        # Only created when the caller has opted into
        # require_live_approval_check AND actually ran a real e2e_command
        # for this live promotion -- require_live_approval_check=true with
        # no e2e_command set creates nothing here, so deploy-stable's gate
        # (verify-stable-gate.sh) finds zero matching check runs and
        # refuses closed, rather than this step quietly self-approving an
        # unvalidated promotion.
        #
        # directive_payload/directive_signature/directive_body are
        # recorded as null here: the CI-invocation bridge that would let a
        # prime-signed directive be attached (aos#193 §1's get_approval
        # round-trip, not yet built) does not exist yet. This is
        # deliberate, not a placeholder to "fill in later and forget" --
        # verify-stable-gate.sh treats null exactly like an invalid
        # signature (refuses closed), so require_live_approval_check: true
        # cannot pass the stable gate until that bridge lands, by
        # construction.
        #
        # aos#193 review finding #5: the check run's NAME is scoped to
        # this app (blue-green/live-e2e-approved/<app_name>, not a bare
        # shared name) so one app's approval on a commit can never satisfy
        # a different app's stable gate in a multi-app repo; app_name is
        # also embedded in output.text and re-verified by
        # verify-stable-gate.sh on read. The creating run's identity
        # itself (repo, sha, and proof it actually executed
        # deploy-app.yml) is bound via --external-id below plus
        # verify-stable-gate.sh's GitHub-Actions-API check -- see aos#193
        # review finding #1 (round 2) and scripts/lib/check-run-binding.sh,
        # never a self-reported workflow_ref text field.
        # --on-permission-denied skip: see finding #1's
        # comment on create-blue-green-check-run.sh -- deploy-caprover has
        # no checks:write today by design (Phase 1b follow-up); a 403 here
        # must not fail a live deploy that already passed real e2e/health
        # checks, only skip recording the approval (verify-stable-gate.sh
        # then correctly refuses closed on the missing record).
        if: needs.resolve-stage.outputs.stage == 'live' && inputs.require_live_approval_check == true && inputs.e2e_command != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # aos#193 review finding #1 (BLOCKER, round 2): no workflow_ref
          # field is recorded here -- inside a reusable workflow,
          # github.workflow_ref names the CALLER's workflow, never
          # deploy-app.yml itself, and a self-reported text field is
          # trivially forgeable anyway. The read side (verify-stable-gate.sh)
          # instead independently verifies, via the GitHub Actions API,
          # that THIS run (named below by --external-id) actually executed
          # deploy-app.yml -- see scripts/lib/check-run-binding.sh.
          OUTPUT_JSON="$(jq -nc \
            --arg repo "${{ github.repository }}" \
            --arg app "${{ inputs.app_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg stage "live" \
            --arg e2e_digest "${{ steps.e2e-command.outputs.e2e_digest }}" \
            '{
              repo: $repo,
              app_name: $app,
              sha: $sha,
              stage: $stage,
              e2e_digest: $e2e_digest,
              directive_payload: null,
              directive_signature: null,
              directive_body: null
            }')"
          .ci-workflows/scripts/create-blue-green-check-run.sh \
            --github-token "$GH_TOKEN" \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --name "blue-green/live-e2e-approved/${{ inputs.app_name }}" \
            --title "Live e2e validated (aos#193 Phase 1)" \
            --summary "e2e_command passed for ${{ inputs.app_name }} at ${{ needs.resolve-stage.outputs.image_ref }}. directive_payload/signature are null pending aos#193 §1's signing bridge -- deploy-stable's gate refuses closed on this until that bridge is wired." \
            --output-json "$OUTPUT_JSON" \
            --external-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --on-permission-denied skip

      - name: Mark first-deploy-used (aos#193 Phase 1 §2)
        # Recorded only once the live promotion above has actually
        # succeeded (this step runs after "Validate target slot health"
        # and "Deep subsystem health check", both of which fail the job on
        # any problem) -- so a first-deploy claim that never actually went
        # healthy never burns the single-use marker. Gated on
        # require_live_approval_check == true too (aos#193 review finding
        # #2): first-deploy-proof.outputs.first_deploy can only be 'true'
        # when that step ran at all, which itself now requires the same
        # opt-in, but the explicit condition here keeps this step's
        # gating self-evident without relying on that transitively.
        #
        # aos#193 review finding #5: same app-scoped name + embedded
        # app_name binding (plus the GitHub-Actions-API run binding via
        # --external-id, aos#193 review finding #1) as the live-e2e-approved
        # check run above, and the identical --on-permission-denied skip
        # reasoning
        # (a missing marker here just means a LATER run's check 3 can't
        # see it -- checks 1/2 in check-first-deploy-proof.sh, which don't
        # depend on this marker, remain the primary proof; see that
        # script's own documented limitation).
        if: needs.resolve-stage.outputs.stage == 'live' && inputs.require_live_approval_check == true && steps.first-deploy-proof.outputs.first_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .ci-workflows/scripts/create-blue-green-check-run.sh \
            --github-token "$GH_TOKEN" \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --name "blue-green/first-deploy-used/${{ inputs.app_name }}" \
            --title "First-deploy proof consumed (aos#193 Phase 1)" \
            --summary "${{ inputs.app_name }} live promotion at ${{ needs.resolve-stage.outputs.image_ref }} used the first-deploy allowance -- a second first-deploy claim for this app on this commit is now refused by check-first-deploy-proof.sh regardless of CapRover/GHCR state." \
            --output-json "$(jq -nc \
              --arg repo "${{ github.repository }}" \
              --arg app "${{ inputs.app_name }}" \
              --arg sha "${{ github.sha }}" \
              --arg image "${{ needs.resolve-stage.outputs.image_ref }}" \
              '{repo: $repo, app_name: $app, sha: $sha, image_ref: $image}')" \
            --external-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --on-permission-denied skip

      - name: Route qwickway to ordered live/stable for live stage
        if: needs.resolve-stage.outputs.stage == 'live'
        run: |
          set -euo pipefail
          GW_URL="${{ secrets.OCI_GATEWAY_CAPROVER_URL }}"
          GW_PASS="${{ secrets.OCI_GATEWAY_CAPROVER_PASSWORD }}"
          GHCR_PULL="${{ secrets.GHCR_PULL_TOKEN }}"

          if [ -z "$GW_URL" ] || [ -z "$GW_PASS" ] || [ -z "$GHCR_PULL" ]; then
            echo "ERROR: OCI gateway credentials missing for live route update"
            exit 1
          fi

          TARGET_URL="${{ needs.resolve-stage.outputs.target_app_url }}"
          if [ -n "${{ inputs.gateway_live_url }}" ]; then
            TARGET_URL="${{ inputs.gateway_live_url }}"
          fi

          STABLE_URL="${{ needs.resolve-stage.outputs.stable_app_url }}"
          STABLE_ARGS=()
          if [ -n "$STABLE_URL" ]; then
            STABLE_ARGS+=(--stable-app-url "$STABLE_URL")
          fi

          .github/scripts/setup-qwickway-route.sh \
            --gateway-app-name "${{ needs.resolve-stage.outputs.gateway_app_name }}" \
            --target-app-url "$TARGET_URL" \
            --route-caprover-url "$GW_URL" \
            --route-caprover-password "$GW_PASS" \
            --health-check-path "${{ inputs.health_path }}" \
            --github-token "$GHCR_PULL" \
            --github-owner "${{ env.OWNER }}" \
            "${STABLE_ARGS[@]}"

      - name: Verify LB target resolves to the node just deployed (infra#101 guard)
        if: needs.resolve-stage.outputs.stage == 'live'
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          SECRETS_SERVICE_KEY: ${{ secrets.SECRETS_SERVICE_KEY }}
        run: |
          set -euo pipefail
          RAW_URL="${{ needs.resolve-stage.outputs.stable_app_url }}"
          # Only meaningful when the target is a bare Tailscale MagicDNS hostname
          # (http(s)://<hostname>.<tailnet>.ts.net[:port]) — CapRover public-domain
          # targets (app.qwickforge.com etc.) are out of scope for this guard.
          #
          # ci-workflows#163: compared case-insensitively. DNS hostnames are
          # case-insensitive (same principle as #160/#161), but this gate
          # wasn't -- a legitimately-cased Tailscale hostname like
          # "https://myapp.mytailnet.TS.NET" failed to match lowercase
          # "*.ts.net*" and silently SKIPPED the infra#101 safety check
          # entirely (not just picked a wrong-but-valid value, the way
          # #161's bug did -- the check never ran at all). RAW_URL_LOWER is
          # used only for this comparison; the real RAW_URL is left
          # untouched for CANONICAL_HOSTNAME below and everything else,
          # since verify-ts-lb-target.sh already downcases the hostname it
          # receives internally (see that script's own comment).
          RAW_URL_LOWER="$(printf '%s' "$RAW_URL" | tr '[:upper:]' '[:lower:]')"
          if [[ "$RAW_URL_LOWER" != *.ts.net* ]]; then
            echo "Target '$RAW_URL' is not a Tailscale hostname; guard not applicable, skipping."
            exit 0
          fi
          CANONICAL_HOSTNAME=$(echo "$RAW_URL" | sed -E 's#^[a-z]+://##; s#\..*$##')

          # TS_API_KEY fallback: fetch from the secrets service if the GH Actions
          # secret is missing or the '-' placeholder. Same pattern as mcp's own
          # deploy.yml TS_API_KEY/TS_AUTHKEY fallback (that pattern is proven —
          # it exists because GH secret propagation on rotation can lag behind
          # what the secrets service already has). Living here rather than in
          # every caller because every consumer of this reusable workflow gets
          # the same TS_API_KEY-goes-stale exposure; a per-repo fix would need
          # repeating N times.
          TS_API_KEY_RESOLVED="${TS_API_KEY:-}"
          if [ "$TS_API_KEY_RESOLVED" = "-" ] || [ -z "$TS_API_KEY_RESOLVED" ]; then
            if [ -n "${SECRETS_SERVICE_KEY:-}" ]; then
              echo "::warning::TS_API_KEY is missing/placeholder; fetching from secrets service"
              _SEC_URL="http://qwickapps-secrets-live.taile324e7.ts.net:7007"
              _SEC_RESP=$(curl -sf --max-time 10 "${_SEC_URL}/v1/secrets/infrastructure/tailscale/TS_API_KEY" \
                -H "x-service-key: ${SECRETS_SERVICE_KEY}" 2>/dev/null || echo "")
              if [ -n "$_SEC_RESP" ]; then
                _SEC_API_KEY=$(echo "$_SEC_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))" 2>/dev/null || echo "")
                if [ -n "$_SEC_API_KEY" ] && [ "$_SEC_API_KEY" != "-" ]; then
                  TS_API_KEY_RESOLVED="$_SEC_API_KEY"
                  echo "::warning::Using TS_API_KEY from secrets service"
                fi
              fi
            fi
          fi

          chmod +x .ci-workflows/scripts/verify-ts-lb-target.sh
          # ci-workflows#189: this checks the STABLE slot's device, not the
          # node THIS live run deployed -- stable is a long-lived,
          # persistent-identity service that is NOT expected to have
          # re-registered during this run, so the created-timestamp
          # freshness check (rule 4) does not apply here. Rules 1-3
          # (exactly one connected, authorized, correctly-named device) are
          # sufficient proof stable is a real, unambiguous, live fallback
          # target.
          .ci-workflows/scripts/verify-ts-lb-target.sh \
            --ts-api-key "$TS_API_KEY_RESOLVED" \
            --canonical-hostname "$CANONICAL_HOSTNAME" \
            --skip-freshness-check

  # -- Tag lifecycle promotion ---------------------------------------------
  retag:
    needs: [resolve-stage, deploy-caprover, validate-env]
    if: |
      always() &&
      needs.resolve-stage.result == 'success' &&
      needs.deploy-caprover.result == 'success' &&
      needs.resolve-stage.outputs.stage != 'stable' &&
      needs.resolve-stage.outputs.next_tag != ''
    runs-on: [self-hosted, macmini]
    # ci-workflows#137: same GITHUB_TOKEN-fallback gap as the build job. This
    # job never checks out the repo, and `imagetools create` writes a new
    # manifest tag, so it needs packages: write (read alone isn't enough).
    permissions:
      packages: write
    steps:
      - name: Authenticate to GHCR for retag (direct config write — no docker login/keychain)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          DOCKER_CONFIG="${RUNNER_TEMP}/docker-retag-${{ github.run_id }}"
          mkdir -p "$DOCKER_CONFIG"
          AUTH="$(printf '%s:%s' '${{ github.actor }}' "$GHCR_TOKEN" | base64 | tr -d '\n')"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"

      - name: Retag immutable image lineage
        run: |
          set -euo pipefail
          SOURCE_IMAGE="${{ needs.resolve-stage.outputs.image_ref }}"
          NEXT_TAG="${{ needs.resolve-stage.outputs.next_tag }}"
          /opt/homebrew/bin/docker-buildx imagetools create -t "$NEXT_TAG" "$SOURCE_IMAGE"
          echo "Retagged $SOURCE_IMAGE -> $NEXT_TAG"

  # -- Build slot cleanup (post-pass only) ----------------------------------
  scale-build-slot:
    needs: [resolve-stage, retag]
    if: always() && needs.resolve-stage.result == 'success' && needs.retag.result == 'success' && needs.resolve-stage.outputs.stage == 'build'
    runs-on: [self-hosted, macmini]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ci-workflows scripts
        uses: actions/checkout@v4
        with:
          repository: qwickapps/ci-workflows
          ref: main
          path: .ci-workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Resolve CapRover credentials
        run: |
          CP_URL="${{ needs.resolve-stage.outputs.caprover_host_name }}"
          CP_PASS="${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}"
          if [ -z "$CP_URL" ] || [ -z "$CP_PASS" ]; then
            CP_URL="${{ secrets.OCI_DEV_CAPROVER_URL }}"
            CP_PASS="${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}"
          fi
          if [ -z "$CP_URL" ] || [ -z "$CP_PASS" ]; then
            echo "ERROR: CapRover credentials missing for dev scale operation"
            exit 1
          fi
          case "$CP_URL" in
            http://*|https://*) ;;
            *) CP_URL="https://$CP_URL" ;;
          esac
          echo "CAPROVER_URL=$CP_URL" >> "$GITHUB_ENV"
          echo "CAPROVER_PASSWORD=$CP_PASS" >> "$GITHUB_ENV"

      - name: Scale build slot to zero on build pass
        run: |
          set -euo pipefail
          chmod +x .ci-workflows/scripts/*.sh
          .ci-workflows/scripts/caprover-slot-admin.sh scale \
            --app-name "${{ needs.resolve-stage.outputs.target_app }}" \
            --instance-count 0 \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD"

  # -- Stable deploy on CapRover ----------------------------------------------
  # mcp#392: the stable slot was assumed to be Coolify-based (see the
  # pre-2026-09-15 history of this job) and deploy-stable deployed via
  # deploy-to-coolify.sh accordingly. Read-only investigation on 2026-09-15
  # (qwickapps/mcp#392) confirmed no app named "<app>-stable" exists on
  # either Coolify instance (macmini or momo) -- the Coolify path was
  # orphaned tooling with nothing real behind it. The actual, live stable
  # slot has always been a CapRover app on the same oci-main cluster as
  # live (confirmed: same nodeId), reachable at the same Tailscale-based
  # health-check mechanism live uses. This job now mirrors deploy-caprover's
  # pattern exactly instead of the orphaned Coolify one.
  deploy-stable:
    needs: [resolve-stage, validate-env, verify-provenance]
    if: |
      always() &&
      needs.resolve-stage.result == 'success' &&
      needs.validate-env.result == 'success' &&
      needs.verify-provenance.result == 'success' &&
      needs.resolve-stage.outputs.stage == 'stable'
    runs-on: [self-hosted, macmini]
    # aos#193 Phase 1 review (round 2): no explicit `permissions:` block
    # here either, for the identical reason given on deploy-caprover
    # above (empirically confirmed: a job's elevated permissions trip
    # reusable-workflow startup_failure validation for the WHOLE workflow
    # regardless of that job's own `if:`). The gate step below
    # (require_live_approval_check == true only) needs checks: read to
    # query the live-e2e-approved check run; until the Phase 1b follow-up
    # lands that permission in the 14 callers' own top-level grants, an
    # early opt-in gets a clear, fail-closed refusal (never a bypass) from
    # verify-stable-gate.sh's existing check_runs_query_failed path.
    concurrency:
      group: caprover-deploy-${{ inputs.app_name }}-${{ needs.resolve-stage.outputs.stage }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ci-workflows scripts
        uses: actions/checkout@v4
        with:
          repository: qwickapps/ci-workflows
          ref: main
          path: .ci-workflows
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Verify live-e2e-approved + directive signature (aos#193 Phase 1 §1/§5)
        # Runs BEFORE any CapRover credential resolution or deploy step
        # below -- a failing gate must block the stable deploy outright,
        # not just annotate it after the fact. Only active when the
        # caller's OWN require_live_approval_check input (on this stable
        # dispatch specifically -- stage runs are independently dispatched,
        # so this is not inherited from the live run) is true; false
        # (default) reproduces today's deploy-stable behavior exactly, with
        # no gate at all.
        if: inputs.require_live_approval_check == true
        env:
          # aos#193 review finding L2 (round 3): every other call site in
          # this workflow passes its GitHub token via `env: GH_TOKEN` and
          # references "$GH_TOKEN" in the script body -- this step was the
          # one exception, passing "${{ github.token }}" directly as a
          # `--github-token` argv value, which is visible to any other
          # process on the shared macmini runner via `ps`. Match the
          # existing convention.
          GH_TOKEN: ${{ github.token }}
          STABLE_GATE_REPO: ${{ github.repository }}
          STABLE_GATE_APP_NAME: ${{ inputs.app_name }}
          STABLE_GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x .ci-workflows/scripts/*.sh

          AOS_PIN_COMMIT="41f0a59ec3990e6aad8649ff79e341d3e6ea25a3"
          AOS_VENV="${RUNNER_TEMP}/aos-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          # aos#193 review finding #4: ALWAYS install into a fresh per-job
          # venv under $RUNNER_TEMP -- never conditionally skip based on
          # `command -v aos`. This runner is shared (self-hosted, macmini,
          # the same fleet aos itself runs on); a stand-in `aos` earlier on
          # PATH, or a stale ~/.local/bin install from an unrelated job on
          # the same box, would otherwise silently decide pass/fail for
          # this gate (reviewer-demonstrated real repro: a no-op `aos` that
          # just exits 0 makes this step report PASS regardless of the
          # real directive).
          echo "::group::Installing pinned aos CLI (qwickapps/aos@41f0a59, aos#123/#125 directive verify) into a fresh per-job venv"

          # aos#193 review finding #3 (LOW-but-required, round 2): resolve
          # python3 to an absolute path ONCE, explicitly, and use that
          # captured absolute path for every step that builds/verifies
          # this venv -- never a bare `python3` re-resolved from PATH at
          # each call site. This runner is shared; a stub `python3`
          # earlier on PATH (or a stale leftover from an unrelated job on
          # the same box) could otherwise fake the ENTIRE venv --
          # including a forged dist-info/direct_url.json carrying the
          # pinned commit -- defeating the commit-pin check below at its
          # root, since everything downstream (pip, the aos binary itself)
          # would then also be whatever that stub planted, not real
          # venv-created binaries. Requiring the resolved path to actually
          # be absolute (not just "command -v succeeded") is the concrete,
          # auditable check: it is logged here so a suspicious resolution
          # is visible in the job log, not silently trusted.
          #
          # aos#193 review finding (LOW, round 3): `command -v python3`
          # was not actually a fix -- it returns an absolute path for a
          # STUB `python3` too, as long as the stub sits somewhere earlier
          # on PATH (for example /tmp/x/python3). "Is the resolved path
          # absolute" proves nothing about which binary it is. Pin to a
          # single, fixed, well-known path instead of resolving from PATH
          # at all.
          #
          # aos#193 review finding B3 (BLOCKER, round 4): round 3's fixed
          # path, /usr/bin/python3, IS the macOS Xcode Command Line Tools
          # shim -- and on the actual runner host (macmini-dev.local, which
          # hosts critical-macmini/macmini-qwickapps-*/macmini-agent-3) it
          # reports Python 3.9.6. qwickapps/aos@41f0a59's pyproject.toml
          # requires ">=3.11", so `pip install` failed outright
          # ("Package 'aos' requires a different Python: 3.9.6 not in
          # '>=3.11'") -- every opted-in deploy-stable run broke at install,
          # before any gate logic ever ran. Pin to the real 3.11+
          # interpreter confirmed present on that same host instead
          # (Homebrew's /opt/homebrew/bin/python3.11, confirmed 3.11.14),
          # and don't just trust the path -- assert the ACTUAL running
          # interpreter's version before ever creating the venv, so a
          # future runner-image change that removes or downgrades this
          # binary fails loudly here instead of at a confusing pip error
          # three steps later.
          PYTHON3_BIN="/opt/homebrew/bin/python3.11"
          if [ ! -x "$PYTHON3_BIN" ]; then
            echo "::error::verify-stable-gate: fixed interpreter '$PYTHON3_BIN' is missing or not executable on this runner -- refusing to build the aos venv (this is deliberately NOT a PATH-based lookup, see the comment above)" >&2
            exit 1
          fi
          if ! "$PYTHON3_BIN" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)'; then
            echo "::error::verify-stable-gate: fixed interpreter '$PYTHON3_BIN' reports $("$PYTHON3_BIN" --version 2>&1), which is older than the 3.11+ qwickapps/aos@${AOS_PIN_COMMIT} requires -- refusing to build the aos venv with an interpreter the install would just fail against anyway" >&2
            exit 1
          fi
          echo "Using fixed python3.11+ interpreter: $PYTHON3_BIN ($("$PYTHON3_BIN" --version 2>&1))"

          # Pinned to the exact reviewed/merged commit the aos#193 design
          # doc built this contract against (round-6 review, 197 tests
          # passing), not @main -- bump this deliberately, not silently,
          # when aos ships a directive-verify-relevant change.
          "$PYTHON3_BIN" -m venv "$AOS_VENV"
          "$AOS_VENV/bin/pip" install --quiet "git+https://github.com/qwickapps/aos.git@${AOS_PIN_COMMIT}"

          # Verify the installed binary's commit matches the pin exactly,
          # from pip's own PEP 610 install-source record -- never just
          # trust that the install command we ran is the code that landed.
          DIST_INFO_DIR="$(find "$AOS_VENV" -maxdepth 4 -iname 'aos-*.dist-info' -print -quit)"
          if [ -z "$DIST_INFO_DIR" ] || [ ! -f "$DIST_INFO_DIR/direct_url.json" ]; then
            echo "::error::verify-stable-gate: could not locate aos dist-info/direct_url.json after install -- cannot confirm the pinned commit was actually installed" >&2
            exit 1
          fi
          INSTALLED_COMMIT="$(jq -r '.vcs_info.commit_id // empty' "$DIST_INFO_DIR/direct_url.json")"
          if [ "$INSTALLED_COMMIT" != "$AOS_PIN_COMMIT" ]; then
            echo "::error::verify-stable-gate: installed aos commit '${INSTALLED_COMMIT:-<none>}' does not match the pinned commit '${AOS_PIN_COMMIT}'" >&2
            exit 1
          fi
          echo "Confirmed installed aos matches pinned commit ${AOS_PIN_COMMIT}"

          # Defense in depth beyond the dist-info file check above: ask
          # the VENV'S OWN python3 (absolute path, never bare `python3`)
          # to actually import the installed package and report where it
          # resolved from -- it must live inside this venv, not be
          # satisfied by some other aos install a stub PATH entry could
          # have smuggled in ahead of the venv's site-packages.
          AOS_MODULE_FILE="$("$AOS_VENV/bin/python3" -c 'import aos, sys; sys.stdout.write(aos.__file__)')"
          case "$AOS_MODULE_FILE" in
            "$AOS_VENV"/*) ;;
            *)
              echo "::error::verify-stable-gate: the venv's own python3 resolved the 'aos' package to '${AOS_MODULE_FILE}', which is NOT inside ${AOS_VENV} -- refusing" >&2
              exit 1
              ;;
          esac
          echo "Confirmed the venv's own python3 imports aos from inside the venv: ${AOS_MODULE_FILE}"
          echo "::endgroup::"

          AOS_BIN="$AOS_VENV/bin/aos"
          if [ ! -x "$AOS_BIN" ]; then
            echo "::error::verify-stable-gate: pinned aos binary not found at $AOS_BIN after install" >&2
            exit 1
          fi

          # aos#193 review finding #4 (HIGH, round 2): pass a REAL,
          # committed, checksum-verified manifest via --aos-manifest --
          # never merely unset $AOS_MANIFEST and hope for a bundled
          # default (aos@41f0a59 ships no manifest in its wheel at all;
          # see verify-stable-gate.sh's header comment for the full
          # correction of this script's previous, factually-wrong claim
          # about a "bundled default manifest"). The checksum is a literal
          # value recorded in THIS file's git history, independent of
          # whatever the runner's filesystem currently holds -- so a
          # compromised runner cannot silently swap the manifest's
          # contents without this check catching it.
          AOS_MANIFEST_PATH=".ci-workflows/scripts/aos-manifest/prime-manifest.yaml"
          AOS_MANIFEST_EXPECTED_SHA256="86131c696dda7edb197a4814210ae9f566b8ae00953f5d5d62a7cd9dc09edbc7"
          if [ ! -f "$AOS_MANIFEST_PATH" ]; then
            echo "::error::verify-stable-gate: pinned manifest not found at ${AOS_MANIFEST_PATH} (expected from the ci-workflows checkout above)" >&2
            exit 1
          fi
          AOS_MANIFEST_ACTUAL_SHA256="$(sha256sum "$AOS_MANIFEST_PATH" | awk '{print $1}')"
          if [ "$AOS_MANIFEST_ACTUAL_SHA256" != "$AOS_MANIFEST_EXPECTED_SHA256" ]; then
            echo "::error::verify-stable-gate: pinned manifest checksum mismatch -- ${AOS_MANIFEST_PATH} sha256='${AOS_MANIFEST_ACTUAL_SHA256}', expected '${AOS_MANIFEST_EXPECTED_SHA256}'. Refusing: this manifest must match exactly what this workflow file's own git history pins, never a runner-local substitute." >&2
            exit 1
          fi
          AOS_MANIFEST_ABS_PATH="$(cd "$(dirname "$AOS_MANIFEST_PATH")" && pwd)/$(basename "$AOS_MANIFEST_PATH")"
          echo "Confirmed pinned manifest checksum: ${AOS_MANIFEST_PATH} sha256=${AOS_MANIFEST_ACTUAL_SHA256}"

          # A fresh, job-scoped, empty environment root -- never the shared
          # macmini runner's ambient $AOS_ENVIRONMENT_ROOT, if any is set.
          AOS_ENV_ROOT="${RUNNER_TEMP}/aos-stable-gate-env-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$AOS_ENV_ROOT"

          .ci-workflows/scripts/verify-stable-gate.sh \
            --github-token "$GH_TOKEN" \
            --repo "$STABLE_GATE_REPO" \
            --app-name "$STABLE_GATE_APP_NAME" \
            --sha "$STABLE_GATE_SHA" \
            --aos-bin "$AOS_BIN" \
            --aos-environment-root "$AOS_ENV_ROOT" \
            --aos-manifest "$AOS_MANIFEST_ABS_PATH"

      - name: Resolve CapRover credentials
        run: |
          if [ -n "${{ inputs.caprover_url }}" ]; then
            CP_URL="${{ inputs.caprover_url }}"
          else
            CP_URL="${{ needs.resolve-stage.outputs.caprover_host_name }}"
          fi

          if [ -z "$CP_URL" ] || [ "$CP_URL" = "null" ]; then
            echo "ERROR: caprover_host_name is required for stage stable"
            exit 1
          fi

          # Ensure scheme is present -- caprover_host inputs are bare hostnames.
          case "$CP_URL" in
            http://*|https://*) ;;
            *) CP_URL="https://$CP_URL" ;;
          esac

          # Same dev/main credential selection deploy-caprover uses (ci-workflows#161:
          # matched case-insensitively).
          CP_URL_LOWER="$(printf '%s' "$CP_URL" | tr '[:upper:]' '[:lower:]')"
          case "$CP_URL_LOWER" in
            *dev.qwickforge.com*)
              CP_PASS="${{ secrets.OCI_DEV_CAPROVER_PASSWORD }}"
              ;;
            *)
              CP_PASS="${{ secrets.OCI_MAIN_CAPROVER_PASSWORD }}"
              ;;
          esac

          if [ -z "$CP_PASS" ] || [ -z "$CP_URL" ]; then
            echo "ERROR: CapRover credentials missing for stable deploy url ${CP_URL}"
            exit 1
          fi

          {
            echo "CAPROVER_URL=$CP_URL"
            echo "CAPROVER_PASSWORD=$CP_PASS"
            echo "GHCR_PULL_TOKEN=${{ secrets.GHCR_PULL_TOKEN }}"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$CP_PASS"

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/*.sh
          chmod +x .ci-workflows/scripts/*.sh

      - name: Download rendered env file artifact (if present)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-env-${{ inputs.environment }}-${{ inputs.app_name }}
          path: .deploy-app-env

      - name: Resolve env file path
        id: env-file
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          STAGE_LABEL="${{ needs.resolve-stage.outputs.env_label }}"
          APP="${{ inputs.app_name }}"

          for candidate in \
            ".deploy-app-env/app-env-${ENV}-${APP}.env" \
            ".deploy-app-env/app-env-${STAGE_LABEL}-${APP}.env" \
            "/tmp/app-env-${ENV}-${APP}.env" \
            "/tmp/app-env-${STAGE_LABEL}-${APP}.env" \
            "/tmp/app-env-${APP}.env"; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::env file not found for app=${APP} env=${ENV} stage=${STAGE_LABEL}"
          exit 1

      - name: Validate stable env file
        run: |
          ENV_FILE="${{ steps.env-file.outputs.path }}"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: missing required stable env file ${ENV_FILE}"
            exit 1
          fi

      - name: Configure target slot (atomic env + config)
        run: |
          set -euo pipefail
          TARGET_APP="${{ needs.resolve-stage.outputs.target_app }}"
          ENV_FILE="${{ steps.env-file.outputs.path }}"

          CMD_ARGS=()
          if [ "${{ inputs.cmd }}" = "__clear__" ]; then
            CMD_ARGS+=(--cmd "")
          elif [ -n "${{ inputs.cmd }}" ]; then
            CMD_ARGS+=(--cmd "${{ inputs.cmd }}")
          fi

          # Same canonical configure script deploy-caprover uses (not the
          # caller's own copy), so the anti-wipe fix (single atomic update)
          # applies to the stable slot too, not just live/uat/build.
          .ci-workflows/scripts/configure-caprover-app.sh \
            --app-name "$TARGET_APP" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --container-port "${{ inputs.container_port }}" \
            --env-file "$ENV_FILE" \
            "${CMD_ARGS[@]+"${CMD_ARGS[@]}"}"

      - name: Deploy image to target slot
        run: |
          .github/scripts/deploy-from-ghcr.sh \
            --app-name "${{ needs.resolve-stage.outputs.target_app }}" \
            --image-ref "${{ needs.resolve-stage.outputs.image_ref }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --github-token "$GHCR_PULL_TOKEN" \
            --github-owner "${{ env.OWNER }}"

      - name: Validate target slot health
        run: |
          .github/scripts/validate-deployment-health.sh \
            --app-name "${{ needs.resolve-stage.outputs.target_app }}" \
            --caprover-url "$CAPROVER_URL" \
            --caprover-password "$CAPROVER_PASSWORD" \
            --app-url "${{ needs.resolve-stage.outputs.target_app_url }}" \
            --health-path "${{ inputs.health_path }}" \
            --max-attempts 15 \
            --sleep 20

      - name: Deep subsystem health check
        run: |
          EFFECTIVE_CRITICAL="${{ inputs.critical_subsystems }}"
          EFFECTIVE_WARNING="${{ inputs.warning_subsystems }}"
          PROD_CRITICAL="${{ inputs.prod_critical_subsystems }}"

          if [ -n "$PROD_CRITICAL" ]; then
            if [ -n "$EFFECTIVE_CRITICAL" ]; then
              EFFECTIVE_CRITICAL="${EFFECTIVE_CRITICAL},${PROD_CRITICAL}"
            else
              EFFECTIVE_CRITICAL="$PROD_CRITICAL"
            fi
          fi

          ARGS=(--url "${{ needs.resolve-stage.outputs.target_app_url }}${{ inputs.health_path }}" --timeout 15 --max-attempts 3 --sleep 10)
          if [ -n "$EFFECTIVE_CRITICAL" ]; then
            ARGS+=(--critical-subsystems "$EFFECTIVE_CRITICAL")
          fi
          if [ -n "$EFFECTIVE_WARNING" ]; then
            ARGS+=(--warning-subsystems "$EFFECTIVE_WARNING")
          fi
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            ARGS+=(--summary-file "$GITHUB_STEP_SUMMARY")
          fi
          .github/scripts/deep-health-check.sh "${ARGS[@]}"

      - name: Smoke test path
        if: inputs.smoke_test_path != ''
        run: |
          set -euo pipefail
          SMOKE_URL="${{ needs.resolve-stage.outputs.target_app_url }}${{ inputs.smoke_test_path }}"
          for attempt in $(seq 1 3); do
            STATUS=$(curl -ksS -o /dev/null -w "%{http_code}" --max-time 15 "$SMOKE_URL" || echo 000)
            echo "  Attempt $attempt: $STATUS"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: smoke test failed for $SMOKE_URL"
          exit 1

      - name: Smoke test command
        if: inputs.smoke_test_command != ''
        env:
          APP_URL: ${{ needs.resolve-stage.outputs.target_app_url }}
          HEALTH_PATH: ${{ inputs.health_path }}
          IMAGE_REF: ${{ needs.resolve-stage.outputs.image_ref }}
          APP_NAME: ${{ inputs.app_name }}
          ENV_LABEL: ${{ needs.resolve-stage.outputs.env_label }}
        run: |
          set -euo pipefail
          ${{ inputs.smoke_test_command }}

      - name: Run migration check
        if: needs.resolve-stage.outputs.run_migrations_for_stage == 'true'
        run: |
          set -euo pipefail
          if [ -x .github/scripts/check-migrations.sh ]; then
            .github/scripts/check-migrations.sh
          elif [ -x .github/scripts/run-migrations.sh ]; then
            .github/scripts/run-migrations.sh
          else
            echo "WARNING: migration check enabled but no migration script is available"
          fi

      - name: Optional stable E2E
        if: inputs.run_e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Optional stable E2E dependencies
        if: inputs.run_e2e == 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --no-frozen-lockfile --store-dir .pnpm-store
          pnpm playwright test --config=playwright.ci.config.ts --project=chromium --grep="smoke|home|health" --timeout=60000 --reporter=line tests/e2e/

      - name: Verify LB target resolves to the node just deployed (infra#101 guard)
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
          SECRETS_SERVICE_KEY: ${{ secrets.SECRETS_SERVICE_KEY }}
        run: |
          set -euo pipefail
          RAW_URL="${{ needs.resolve-stage.outputs.target_app_url }}"
          # Only meaningful when the target is a bare Tailscale MagicDNS hostname
          # (http(s)://<hostname>.<tailnet>.ts.net[:port]) — CapRover public-domain
          # targets (app.qwickforge.com etc.) are out of scope for this guard.
          #
          # ci-workflows#163: compared case-insensitively -- see the sibling
          # comment in deploy-caprover's copy of this step for why.
          RAW_URL_LOWER="$(printf '%s' "$RAW_URL" | tr '[:upper:]' '[:lower:]')"
          if [[ "$RAW_URL_LOWER" != *.ts.net* ]]; then
            echo "Target '$RAW_URL' is not a Tailscale hostname; guard not applicable, skipping."
            exit 0
          fi
          CANONICAL_HOSTNAME=$(echo "$RAW_URL" | sed -E 's#^[a-z]+://##; s#\..*$##')

          # TS_API_KEY fallback: fetch from the secrets service if the GH Actions
          # secret is missing or the '-' placeholder. Same pattern as mcp's own
          # deploy.yml TS_API_KEY/TS_AUTHKEY fallback (that pattern is proven —
          # it exists because GH secret propagation on rotation can lag behind
          # what the secrets service already has). Living here rather than in
          # every caller because every consumer of this reusable workflow gets
          # the same TS_API_KEY-goes-stale exposure; a per-repo fix would need
          # repeating N times.
          TS_API_KEY_RESOLVED="${TS_API_KEY:-}"
          if [ "$TS_API_KEY_RESOLVED" = "-" ] || [ -z "$TS_API_KEY_RESOLVED" ]; then
            if [ -n "${SECRETS_SERVICE_KEY:-}" ]; then
              echo "::warning::TS_API_KEY is missing/placeholder; fetching from secrets service"
              _SEC_URL="http://qwickapps-secrets-live.taile324e7.ts.net:7007"
              _SEC_RESP=$(curl -sf --max-time 10 "${_SEC_URL}/v1/secrets/infrastructure/tailscale/TS_API_KEY" \
                -H "x-service-key: ${SECRETS_SERVICE_KEY}" 2>/dev/null || echo "")
              if [ -n "$_SEC_RESP" ]; then
                _SEC_API_KEY=$(echo "$_SEC_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))" 2>/dev/null || echo "")
                if [ -n "$_SEC_API_KEY" ] && [ "$_SEC_API_KEY" != "-" ]; then
                  TS_API_KEY_RESOLVED="$_SEC_API_KEY"
                  echo "::warning::Using TS_API_KEY from secrets service"
                fi
              fi
            fi
          fi

          chmod +x .ci-workflows/scripts/verify-ts-lb-target.sh
          .ci-workflows/scripts/verify-ts-lb-target.sh \
            --ts-api-key "$TS_API_KEY_RESOLVED" \
            --canonical-hostname "$CANONICAL_HOSTNAME" \
            --deploy-start-epoch "${{ needs.resolve-stage.outputs.deploy_start_epoch }}"
