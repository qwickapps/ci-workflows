name: Deploy App CapRover Credentials Tests

# Regression gate for ci-workflows#161: deploy-app.yml's "Resolve CapRover
# credentials" step (deploy-caprover job) must select the dev vs. main
# CapRover password case-insensitively. DNS hostnames are case-insensitive;
# a mixed-case host (via caprover_host_name or a direct caprover_url
# override) previously selected the wrong secret.
#
# Tests:
#   bash scripts/tests/deploy-app-caprover-credentials.test.sh
#     - extracts the credentials-resolution step's actual embedded script
#       from this file (a real YAML parse) and EXECUTES it under controlled
#       inputs, asserting which secret marker was actually selected -- a
#       dynamic proof, not a string grep.

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-app.yml'
      - '.github/workflows/deploy-app-caprover-credentials-tests.yml'
      - 'scripts/tests/deploy-app-caprover-credentials.test.sh'
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/deploy-app.yml'
      - 'scripts/tests/deploy-app-caprover-credentials.test.sh'

permissions:
  contents: read

jobs:
  contract:
    name: deploy-app.yml CapRover credentials tests
    runs-on: [self-hosted, macmini]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CapRover credentials contract test
        run: bash scripts/tests/deploy-app-caprover-credentials.test.sh
