name: Stable Host Policy Proof

# Inert proof for ci-workflows#236 / infra#41: dispatches the real
# promote-to-stable.yml for Forge against the oci-main CapRover URL and must
# fail at the stable-host policy check, before any CapRover login or write.
#
# Deliberately inert even if the policy check were missing:
#   - caprover_url is the public oci-main hostname (so resolution is OCI_MAIN),
#     but NO CapRover password is passed, so the credential check fails closed;
#   - the only GHCR token passed is the read-only pull token (this repo holds
#     no push token), so no GHCR tag can be written;
#   - image_ref names a nonexistent image that also fails input validation.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Forge stable target environment
        required: true
        type: choice
        options: [prod, uat]

permissions:
  contents: read

jobs:
  prove-forge-is-refused:
    uses: ./.github/workflows/promote-to-stable.yml
    with:
      app_name: qwickapps-forge
      environment: ${{ inputs.environment }}
      image_ref: ghcr.io/qwickapps/img-policy-proof-does-not-exist:never
      health_path: /_health
      caprover_url: https://captain.app.qwickforge.com
    secrets:
      GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
