name: "Org GHCR Prune"

# Scheduled, live-ref-aware GHCR prune for the qwickapps org
# (scripts/ghcr-prune.py, ci-workflows#220). The weekly scheduled sweep
# enforces the decided retention policy: keep the five newest versions per
# package and delete only versions that pass every safety predicate. Manual
# workflow_dispatch remains dry-run by default so humans can inspect a JSONL
# report before choosing an explicit enforcing run.

on:
  # The scheduled sweep enforces retention; manual runs default to dry-run.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Actually delete after safety checks (manual runs default to dry-run)"
        required: false
        type: boolean
        default: false
      keep:
        description: "Versions to keep per package"
        required: false
        type: string
        default: "5"

permissions:
  packages: write
  contents: read

jobs:
  prune:
    name: "Live-ref-aware GHCR prune"
    runs-on: [self-hosted, macmini]
    timeout-minutes: 60
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Run org-wide GHCR prune
        env:
          # github.token cannot enumerate org-owned packages. Prefer the
          # configured org PAT; retain the fallback only for environments
          # where the secret has not yet been configured.
          GH_TOKEN: ${{ secrets.GITHUB_PAT_RW_QWICKAPPS_CONTENTS || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENFORCE: ${{ inputs.enforce }}
          INPUT_KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          args=(--org qwickapps --keep "${INPUT_KEEP:-5}" --output /tmp/ghcr-prune-report.jsonl)
          if [ "$EVENT_NAME" = "schedule" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_ENFORCE" = "true" ]; }; then
            args+=(--enforce)
          fi
          python3 scripts/ghcr-prune.py "${args[@]}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghcr-prune-report-${{ github.run_id }}
          path: /tmp/ghcr-prune-report.jsonl
          retention-days: 30
          if-no-files-found: warn
